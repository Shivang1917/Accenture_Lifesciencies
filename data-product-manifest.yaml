transformation:
  - isDynamic: true
    alias: Transform
    description: Transforming Data of Healthcare Professional 360
    sequence: 9
    inputDataFrameList:
      - inputDataFrame: Pharma_Covigilance_and_Patient_Safety_Product_1
        tempViewName: Pharma_Covigilance
      - inputDataFrame: Hcp_Next_Best_Action_1
        tempViewName: HCP_NEXT_BEST_ACTION
      - inputDataFrame: Safety_Cases_1
        tempViewName: SAFETY_CASES
      - inputDataFrame: Sales_Data_1
        tempViewName: SALES_DATA
      - inputDataFrame: Hcp_Master_1
        tempViewName: HCP_MASTER
      - inputDataFrame: Hcp_Engagements_1
        tempViewName: HCP_ENGAGEMENTS
      - inputDataFrame: Regulatory_Submissions_1
        tempViewName: REGULATORY_SUBMISSIONS
      - inputDataFrame: Market_Access_1
        tempViewName: MARKET_ACCESS
    query: WITH prescribing_behavior AS ( SELECT sc.PRODUCT_NAME,
      sc.COUNTRY_OF_OCCURRENCE AS COUNTRY, COUNT(DISTINCT sc.CASE_ID) AS
      TOTAL_AE_CASES_REPORTED, SUM(CASE WHEN sc.SERIOUSNESS = 'Serious' THEN 1
      ELSE 0 END) AS SERIOUS_AE_COUNT, SUM(CASE WHEN sc.SERIOUSNESS =
      'Non-Serious' THEN 1 ELSE 0 END) AS NON_SERIOUS_AE_COUNT, SUM(CASE WHEN
      sc.CAUSALITY_ASSESSMENT = 'Probable' THEN 1 ELSE 0 END) AS
      PROBABLE_CAUSALITY_COUNT FROM SAFETY_CASES sc WHERE sc.REPORTER_TYPE =
      'HCP' GROUP BY sc.PRODUCT_NAME, sc.COUNTRY_OF_OCCURRENCE ), commercial_rx
      AS ( SELECT sd.PRODUCT_NAME, sd.COUNTRY, sd.THERAPEUTIC_AREA, sd.CHANNEL,
      SUM(sd.QUANTITY) AS TOTAL_UNITS_SOLD, SUM(sd.REVENUE_USD) AS
      TOTAL_REVENUE_USD, AVG(sd.NET_PRICE_USD) AS AVG_NET_PRICE_USD,
      COUNT(DISTINCT sd.PAYER_TYPE) AS PAYER_DIVERSITY, MAX(sd.FORMULARY_STATUS)
      AS FORMULARY_STATUS FROM SALES_DATA sd GROUP BY sd.PRODUCT_NAME,
      sd.COUNTRY, sd.THERAPEUTIC_AREA, sd.CHANNEL ), market_coverage AS ( SELECT
      ma.PRODUCT_NAME, ma.COUNTRY, ma.PAYER_NAME, ma.PAYER_TYPE,
      ma.COVERAGE_STATUS, ma.FORMULARY_TIER, ma.REIMBURSEMENT_RATE,
      ma.HTA_OUTCOME, ma.PRICE_PER_UNIT_USD AS LIST_PRICE_USD FROM MARKET_ACCESS
      ma ), engagement_summary AS ( SELECT eng.HCP_ID, eng.PRODUCT_NAME,
      COUNT(DISTINCT eng.ENGAGEMENT_ID) AS TOTAL_ENGAGEMENTS, SUM(CASE WHEN
      eng.ENGAGEMENT_TYPE = 'MSL Visit' THEN 1 ELSE 0 END) AS MSL_VISITS,
      SUM(CASE WHEN eng.ENGAGEMENT_TYPE = 'Webinar' THEN 1 ELSE 0 END) AS
      WEBINAR_ATTENDANCES, SUM(CASE WHEN eng.ENGAGEMENT_TYPE = 'Email Campaign'
      THEN 1 ELSE 0 END) AS EMAIL_INTERACTIONS, SUM(CASE WHEN
      eng.ENGAGEMENT_TYPE = 'Conference' THEN 1 ELSE 0 END) AS
      CONFERENCE_PARTICIPATIONS, SUM(CASE WHEN eng.ENGAGEMENT_TYPE = 'Advisory
      Board' THEN 1 ELSE 0 END) AS ADVISORY_BOARD_PARTICIPATIONS, SUM(CASE WHEN
      eng.ENGAGEMENT_TYPE = 'AE Report' THEN 1 ELSE 0 END) AS AE_REPORTS_FILED,
      ROUND( SUM(CASE WHEN eng.SENTIMENT = 'Positive' THEN 1 ELSE 0 END) * 100.0
      / CASE WHEN COUNT(DISTINCT eng.ENGAGEMENT_ID) = 0 THEN NULL ELSE
      COUNT(DISTINCT eng.ENGAGEMENT_ID) END , 2) AS POSITIVE_SENTIMENT_RATE_PCT,
      MAX(eng.ENGAGEMENT_DATE) AS LAST_ENGAGEMENT_DATE FROM HCP_ENGAGEMENTS eng
      GROUP BY eng.HCP_ID, eng.PRODUCT_NAME ), nba_latest AS ( SELECT * FROM (
      SELECT nba.HCP_ID, nba.PRODUCT_NAME, nba.RECOMMENDED_ACTION AS
      NBA_RECOMMENDED_ACTION, nba.ACTION_CATEGORY AS NBA_CATEGORY, nba.PRIORITY
      AS NBA_PRIORITY, nba.INTENT_SIGNAL AS NBA_INTENT_SIGNAL,
      nba.CONFIDENCE_SCORE AS NBA_CONFIDENCE_SCORE, nba.ASSIGNED_TO AS
      NBA_OWNER, nba.DUE_DATE AS NBA_DUE_DATE, nba.STATUS AS NBA_STATUS,
      ROW_NUMBER() OVER (PARTITION BY nba.HCP_ID, nba.PRODUCT_NAME ORDER BY
      nba.CONFIDENCE_SCORE DESC) AS RN FROM HCP_NEXT_BEST_ACTION nba ) t WHERE
      RN = 1 ), regulatory_flags AS ( SELECT rs.PRODUCT_NAME, rs.BRAND_NAME,
      rs.COUNTRY, rs.REGULATORY_BODY, rs.STATUS AS APPROVAL_STATUS,
      rs.SUBMISSION_TYPE, COALESCE(rs.ACTUAL_APPROVAL_DATE,
      rs.TARGET_APPROVAL_DATE) AS APPROVAL_DATE, rs.REFERENCE_BIOLOGIC,
      rs.PATENT_EXPIRY_DATE, CASE WHEN rs.SUBMISSION_TYPE IN ('BLA/ANDA') AND
      rs.STATUS = 'Approved' THEN TRUE ELSE FALSE END AS
      INTERCHANGEABILITY_DESIGNATED, CASE WHEN rs.STATUS = 'Approved' AND
      months_between(current_date(), rs.ACTUAL_APPROVAL_DATE) <= 6 THEN TRUE
      ELSE FALSE END AS RECENT_APPROVAL_FLAG FROM REGULATORY_SUBMISSIONS rs ),
      pv_cross_domain AS ( SELECT pv.PRODUCT_NAME, pv.COUNTRY_OF_OCCURRENCE,
      COUNT(DISTINCT pv.CASE_ID) AS PV_TOTAL_CASES, SUM(CASE WHEN pv.SERIOUSNESS
      = 'Serious' THEN 1 ELSE 0 END) AS PV_SERIOUS_CASES, MAX(pv.ICSR_STATUS) AS
      PV_ICSR_STATUS, MAX(pv.E2B_COMPLIANT) AS PV_E2B_COMPLIANT,
      MAX(pv.PSUR_STATUS) AS PV_PSUR_STATUS, MAX(pv.BENEFIT_RISK_CONCLUSION) AS
      PV_BENEFIT_RISK_CONCLUSION, MAX(pv.PSUR_TOTAL_CASES) AS
      PV_PSUR_TOTAL_CASES, AVG(pv.DAYS_TO_SUBMIT) AS PV_AVG_DAYS_TO_SUBMIT FROM
      Pharma_Covigilance pv GROUP BY pv.PRODUCT_NAME, pv.COUNTRY_OF_OCCURRENCE )
      SELECT HCP.HCP_ID, HCP.HCP_NAME, HCP.SPECIALTY, HCP.SUB_SPECIALTY,
      HCP.PRACTICE_SETTING, HCP.AFFILIATION, HCP.TERRITORY, HCP.REGION,
      HCP.COUNTRY, HCP.KOL_TIER, HCP.PRESCRIBER_SEGMENT, HCP.NPI_NUMBER,
      HCP.YEARS_IN_PRACTICE, HCP.PRIMARY_THERAPEUTIC_AREA,
      HCP.BIOSIMILAR_ADOPTION_SCORE, crx.PRODUCT_NAME, crx.THERAPEUTIC_AREA,
      crx.CHANNEL, crx.TOTAL_UNITS_SOLD, crx.TOTAL_REVENUE_USD,
      crx.AVG_NET_PRICE_USD, crx.PAYER_DIVERSITY, crx.FORMULARY_STATUS,
      mc.PAYER_NAME, mc.PAYER_TYPE, mc.COVERAGE_STATUS, mc.FORMULARY_TIER,
      mc.REIMBURSEMENT_RATE, mc.HTA_OUTCOME, mc.LIST_PRICE_USD,
      ROUND((crx.AVG_NET_PRICE_USD - mc.LIST_PRICE_USD) * 100.0 / CASE WHEN
      mc.LIST_PRICE_USD = 0 THEN NULL ELSE mc.LIST_PRICE_USD END, 2) AS
      PRICE_DISCOUNT_PCT, pb.TOTAL_AE_CASES_REPORTED, pb.SERIOUS_AE_COUNT,
      pb.NON_SERIOUS_AE_COUNT, pb.PROBABLE_CAUSALITY_COUNT,
      es.TOTAL_ENGAGEMENTS, es.MSL_VISITS, es.WEBINAR_ATTENDANCES,
      es.EMAIL_INTERACTIONS, es.CONFERENCE_PARTICIPATIONS,
      es.ADVISORY_BOARD_PARTICIPATIONS, es.AE_REPORTS_FILED,
      es.POSITIVE_SENTIMENT_RATE_PCT, es.LAST_ENGAGEMENT_DATE,
      datediff(current_date(), es.LAST_ENGAGEMENT_DATE) AS
      DAYS_SINCE_LAST_ENGAGEMENT, nba.NBA_RECOMMENDED_ACTION, nba.NBA_CATEGORY,
      nba.NBA_PRIORITY, nba.NBA_INTENT_SIGNAL, nba.NBA_CONFIDENCE_SCORE,
      nba.NBA_OWNER, nba.NBA_DUE_DATE, nba.NBA_STATUS, rf.REGULATORY_BODY,
      rf.APPROVAL_STATUS, rf.SUBMISSION_TYPE, rf.APPROVAL_DATE,
      rf.REFERENCE_BIOLOGIC, rf.PATENT_EXPIRY_DATE, rf.RECENT_APPROVAL_FLAG,
      CASE WHEN rf.INTERCHANGEABILITY_DESIGNATED = TRUE AND hcp.KOL_TIER IN
      ('Tier 1','Tier 2') THEN TRUE ELSE FALSE END AS TARGETED_OUTREACH_FLAG,
      pvd.PV_TOTAL_CASES, pvd.PV_SERIOUS_CASES, pvd.PV_ICSR_STATUS,
      pvd.PV_E2B_COMPLIANT, pvd.PV_PSUR_STATUS, pvd.PV_BENEFIT_RISK_CONCLUSION,
      pvd.PV_PSUR_TOTAL_CASES, pvd.PV_AVG_DAYS_TO_SUBMIT FROM HCP_MASTER hcp
      LEFT JOIN engagement_summary es ON hcp.HCP_ID = es.HCP_ID LEFT JOIN
      commercial_rx crx ON hcp.PRIMARY_THERAPEUTIC_AREA = crx.THERAPEUTIC_AREA
      AND hcp.COUNTRY = crx.COUNTRY LEFT JOIN market_coverage mc ON
      crx.PRODUCT_NAME = mc.PRODUCT_NAME AND crx.COUNTRY = mc.COUNTRY LEFT JOIN
      prescribing_behavior pb ON crx.PRODUCT_NAME = pb.PRODUCT_NAME AND
      crx.COUNTRY = pb.COUNTRY LEFT JOIN nba_latest nba ON hcp.HCP_ID =
      nba.HCP_ID AND es.PRODUCT_NAME = nba.PRODUCT_NAME LEFT JOIN
      regulatory_flags rf ON crx.PRODUCT_NAME = rf.PRODUCT_NAME AND crx.COUNTRY
      = rf.COUNTRY LEFT JOIN pv_cross_domain pvd ON crx.PRODUCT_NAME =
      pvd.PRODUCT_NAME AND hcp.COUNTRY = pvd.COUNTRY_OF_OCCURRENCE
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules: {}
