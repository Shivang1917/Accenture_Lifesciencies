productState:
  isDynamic: true
  alias: loading_Biosimilar_Clinical_And_Regulatory_Intelligence_Product_data_in_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      PRODUCT_NAME:
        type: STRING
        description: Name of the biosimilar product under clinical development
        sourceColumn: PRODUCT_NAME
        sourceTable: STG_CLINICAL_TRIALS
      THERAPEUTIC_AREA:
        type: STRING
        description: Therapeutic area of the product (e.g., Immunology, Oncology)
        sourceColumn: THERAPEUTIC_AREA
        sourceTable: STG_CLINICAL_TRIALS
      TRIAL_ID:
        type: STRING
        description: Unique identifier for the clinical trial
        sourceColumn: TRIAL_ID
        sourceTable: STG_CLINICAL_TRIALS
      TRIAL_NAME:
        type: STRING
        description: Descriptive name of the clinical trial
        sourceColumn: TRIAL_NAME
        sourceTable: STG_CLINICAL_TRIALS
      PHASE:
        type: STRING
        description: Clinical trial phase (e.g., Phase I, Phase II, Phase III)
        sourceColumn: PHASE
        sourceTable: STG_CLINICAL_TRIALS
      TRIAL_STATUS:
        type: STRING
        description: Current status of the trial (Active, Completed, etc.)
        sourceColumn: STATUS
        sourceTable: STG_CLINICAL_TRIALS
      ENROLLMENT_TARGET:
        type: STRING
        description: Planned number of patients to enroll in the trial
        sourceColumn: ENROLLMENT_TARGET
        sourceTable: STG_CLINICAL_TRIALS
      ENROLLMENT_ACTUAL:
        type: STRING
        description: Actual number of patients enrolled to date
        sourceColumn: ENROLLMENT_ACTUAL
        sourceTable: STG_CLINICAL_TRIALS
      ENROLLMENT_RATE_PCT:
        type: STRING
        description: "Calculated enrollment rate: ROUND(ENROLLMENT_ACTUAL * 100.0 /
          NULLIF(ENROLLMENT_TARGET, 0), 2)"
        sourceColumn: DERIVED
        sourceTable: STG_CLINICAL_TRIALS
      COUNTRY:
        type: STRING
        description: Country where the clinical trial is conducted
        sourceColumn: COUNTRY
        sourceTable: STG_CLINICAL_TRIALS
      REGULATORY_BODY:
        type: STRING
        description: Regulatory authority overseeing the trial (e.g., FDA, EMA)
        sourceColumn: REGULATORY_BODY
        sourceTable: STG_CLINICAL_TRIALS
      SUBMISSION_ID:
        type: STRING
        description: Unique identifier for the regulatory submission
        sourceColumn: SUBMISSION_ID
        sourceTable: STG_REGULATORY_SUBMISSIONS
      SUBMISSION_TYPE:
        type: STRING
        description: Type of regulatory filing (e.g., BLA/ANDA, MAA, WHO PQ)
        sourceColumn: SUBMISSION_TYPE
        sourceTable: STG_REGULATORY_SUBMISSIONS
      SUBMISSION_DATE:
        type: STRING
        description: Date the regulatory submission was filed
        sourceColumn: SUBMISSION_DATE
        sourceTable: STG_REGULATORY_SUBMISSIONS
      TARGET_APPROVAL_DATE:
        type: STRING
        description: Expected date of regulatory approval
        sourceColumn: TARGET_APPROVAL_DATE
        sourceTable: STG_REGULATORY_SUBMISSIONS
      ACTUAL_APPROVAL_DATE:
        type: STRING
        description: Actual date regulatory approval was granted (NULL if pending)
        sourceColumn: ACTUAL_APPROVAL_DATE
        sourceTable: STG_REGULATORY_SUBMISSIONS
      SUBMISSION_STATUS:
        type: STRING
        description: Current status of the submission (Approved, Under Review, Submitted)
        sourceColumn: STATUS
        sourceTable: STG_REGULATORY_SUBMISSIONS
      DAYS_SINCE_SUBMISSION:
        type: STRING
        description: "Calculated days elapsed: DATEDIFF('day', SUBMISSION_DATE,
          CURRENT_DATE())"
        sourceColumn: DERIVED
        sourceTable: STG_REGULATORY_SUBMISSIONS
      SIGNAL_ID:
        type: STRING
        description: Unique identifier for the safety signal
        sourceColumn: SIGNAL_ID
        sourceTable: STG_SAFETY_SIGNALS
      SIGNAL_TYPE:
        type: STRING
        description: Type of safety signal (e.g., Disproportionality, Post-Market)
        sourceColumn: SIGNAL_TYPE
        sourceTable: STG_SAFETY_SIGNALS
      SIGNAL_SEVERITY:
        type: STRING
        description: Severity level of the signal (High, Medium, Low)
        sourceColumn: SEVERITY
        sourceTable: STG_SAFETY_SIGNALS
      SIGNAL_STATUS:
        type: STRING
        description: Current status of the signal (Open, Closed, Under Investigation)
        sourceColumn: STATUS
        sourceTable: STG_SAFETY_SIGNALS
      SIGNAL_DETECTION_DATE:
        type: STRING
        description: Date the safety signal was first detected
        sourceColumn: DETECTION_DATE
        sourceTable: STG_SAFETY_SIGNALS
