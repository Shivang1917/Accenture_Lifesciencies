  refreshInterval: 30 5 * * *
transformation:
  - isDynamic: true
    alias: Transform
    description: Transform Data for Pharma Covigilance and Patient Safety Product
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Icsr_Reports_1
        tempViewName: ICSR_REPORTS
      - inputDataFrame: Psur_Reports_1
        tempViewName: PSUR_REPORTS
      - inputDataFrame: Safety_Cases_1
        tempViewName: SAFETY_CASES
    query: " SELECT sc.CASE_ID, sc.CASE_NUMBER, sc.PRODUCT_NAME, sc.EVENT_TYPE,
      sc.SERIOUSNESS, sc.SERIOUSNESS_CRITERIA, sc.OUTCOME, sc.REPORTER_TYPE,
      sc.COUNTRY_OF_OCCURRENCE, sc.RECEIPT_DATE, sc.ONSET_DATE, sc.REPORT_TYPE,
      sc.CAUSALITY_ASSESSMENT, sc.MED_DRA_PT, sc.MED_DRA_SOC, sc.PATIENT_AGE,
      sc.PATIENT_GENDER, sc.E2B_VERSION, icsr.ICSR_ID, icsr.DESTINATION AS
      ICSR_DESTINATION, icsr.SUBMISSION_DATE AS ICSR_SUBMISSION_DATE,
      icsr.DUE_DATE AS ICSR_DUE_DATE, icsr.STATUS AS ICSR_STATUS,
      icsr.E2B_COMPLIANT, icsr.EXPEDITED, datediff(icsr.SUBMISSION_DATE,
      sc.RECEIPT_DATE) AS DAYS_TO_SUBMIT, psur.PSUR_ID, psur.REPORT_TYPE AS
      PSUR_TYPE, psur.STATUS AS PSUR_STATUS, psur.TOTAL_CASES AS
      PSUR_TOTAL_CASES, psur.SERIOUS_CASES AS PSUR_SERIOUS_CASES,
      psur.BENEFIT_RISK_CONCLUSION FROM SAFETY_CASES sc LEFT JOIN ICSR_REPORTS
      icsr ON sc.CASE_ID = icsr.CASE_ID LEFT JOIN PSUR_REPORTS psur ON
      sc.PRODUCT_NAME = psur.PRODUCT_NAME"
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
