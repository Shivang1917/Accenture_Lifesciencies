transformation:
  - isDynamic: true
    alias: Transform
    description: " Transform Biosimilar Switching Adoption Analytics"
    sequence: 6
    inputDataFrameList:
      - inputDataFrame: R&D_Pipeline_And_Biologics_Research_1
        tempViewName: RND_PIPELINE
      - inputDataFrame: Biosimilar_Clinical_And_Regulatory_Intelligence_Product_1
        tempViewName: BIOSIMILAR_PRODUCT
      - inputDataFrame: Global_Commercial_Market_Access_1
        tempViewName: GLOBAL_COMMERCIAL
      - inputDataFrame: Global_Supply_Chain_And_Manufacturing_Quality_1
        tempViewName: GLOBAL_SUPPLY
      - inputDataFrame: Pharma_Covigilance_and_Patient_Safety_Product_1
        tempViewName: PHARMA_COVIGILANCE
    query: WITH product_list AS ( SELECT DISTINCT PRODUCT_NAME FROM
      BIOSIMILAR_PRODUCT UNION SELECT DISTINCT PRODUCT_NAME FROM GLOBAL_SUPPLY
      UNION SELECT DISTINCT PRODUCT_NAME FROM GLOBAL_COMMERCIAL UNION SELECT
      DISTINCT PRODUCT_NAME FROM RND_PIPELINE UNION SELECT DISTINCT PRODUCT_NAME
      FROM PHARMA_COVIGILANCE ), bio_summary AS ( SELECT PRODUCT_NAME,
      COUNT(DISTINCT TRIAL_ID) AS TOTAL_TRIALS, SUM(CASE WHEN TRIAL_STATUS =
      'Active' THEN 1 ELSE 0 END) AS ACTIVE_TRIALS, SUM(CASE WHEN TRIAL_STATUS =
      'Completed' THEN 1 ELSE 0 END) AS COMPLETED_TRIALS,
      AVG(ENROLLMENT_RATE_PCT) AS AVG_ENROLLMENT_RATE, COUNT(DISTINCT
      SUBMISSION_ID) AS TOTAL_SUBMISSIONS, SUM(CASE WHEN APPROVAL_STATUS =
      'Approved' THEN 1 ELSE 0 END) AS APPROVED_SUBMISSIONS, COUNT(DISTINCT
      SIGNAL_ID) AS TOTAL_SIGNALS, SUM(CASE WHEN SIGNAL_SEVERITY = 'High' THEN 1
      ELSE 0 END) AS HIGH_SEVERITY_SIGNALS FROM BIOSIMILAR_PRODUCT GROUP BY
      PRODUCT_NAME ), mfg_summary AS ( SELECT PRODUCT_NAME, COUNT(DISTINCT
      BATCH_ID) AS TOTAL_BATCHES, AVG(YIELD_PERCENT) AS AVG_YIELD, SUM(CASE WHEN
      GMP_COMPLIANT = 1 THEN 1 ELSE 0 END) AS GMP_COMPLIANT_BATCHES,
      SUM(DEVIATION_COUNT) AS TOTAL_DEVIATIONS, AVG(OEE_PERCENT) AS AVG_OEE,
      COUNT(DISTINCT QUALITY_EVENT_ID) AS TOTAL_QUALITY_EVENTS, SUM(CASE WHEN
      QUALITY_EVENT_SEVERITY = 'Major' THEN 1 ELSE 0 END) AS
      MAJOR_QUALITY_EVENTS FROM GLOBAL_SUPPLY GROUP BY PRODUCT_NAME ),
      com_summary AS ( SELECT PRODUCT_NAME, COUNT(DISTINCT SALE_ID) AS
      TOTAL_SALES_TRANSACTIONS, SUM(REVENUE_USD) AS TOTAL_REVENUE_USD,
      SUM(QUANTITY) AS TOTAL_UNITS_SOLD, AVG(NET_PRICE_USD) AS AVG_NET_PRICE,
      COUNT(DISTINCT COUNTRY) AS MARKETS_ACTIVE, AVG(REIMBURSEMENT_RATE) AS
      AVG_REIMBURSEMENT_RATE, AVG(DISCOUNT_PERCENT) AS AVG_DISCOUNT_PERCENT,
      SUM(NET_REVENUE_AFTER_DISCOUNT) AS TOTAL_NET_REVENUE FROM
      GLOBAL_COMMERCIAL GROUP BY PRODUCT_NAME ), rnd_summary AS ( SELECT
      PRODUCT_NAME, COUNT(DISTINCT PROGRAM_ID) AS TOTAL_PROGRAMS, MAX(PHASE) AS
      LATEST_PHASE, SUM(BUDGET_USD) AS TOTAL_BUDGET, SUM(SPEND_TO_DATE_USD) AS
      TOTAL_SPEND, AVG(BUDGET_UTILIZATION_PCT) AS AVG_BUDGET_UTILIZATION,
      COUNT(DISTINCT FILING_ID) AS TOTAL_IND_FILINGS, SUM(CASE WHEN
      CLINICAL_HOLD = TRUE THEN 1 ELSE 0 END) AS CLINICAL_HOLDS, COUNT(DISTINCT
      RESEARCH_ID) AS TOTAL_RESEARCH_EXPERIMENTS FROM RND_PIPELINE GROUP BY
      PRODUCT_NAME ), pv_summary AS ( SELECT PRODUCT_NAME, COUNT(DISTINCT
      CASE_ID) AS TOTAL_AE_CASES, SUM(CASE WHEN SERIOUSNESS = 'Serious' THEN 1
      ELSE 0 END) AS SERIOUS_CASES, SUM(CASE WHEN OUTCOME = 'Fatal' THEN 1 ELSE
      0 END) AS FATAL_CASES, COUNT(DISTINCT ICSR_ID) AS TOTAL_ICSR_SUBMITTED,
      AVG(DAYS_TO_SUBMIT) AS AVG_DAYS_TO_SUBMIT_ICSR, SUM(CASE WHEN EXPEDITED =
      TRUE THEN 1 ELSE 0 END) AS EXPEDITED_REPORTS, SUM(CASE WHEN E2B_COMPLIANT
      = TRUE THEN 1 ELSE 0 END) AS E2B_COMPLIANT_REPORTS FROM PHARMA_COVIGILANCE
      GROUP BY PRODUCT_NAME ) SELECT pl.PRODUCT_NAME, COALESCE(bio.TOTAL_TRIALS,
      0) AS TOTAL_TRIALS, COALESCE(bio.ACTIVE_TRIALS, 0) AS ACTIVE_TRIALS,
      COALESCE(bio.COMPLETED_TRIALS, 0) AS COMPLETED_TRIALS,
      bio.AVG_ENROLLMENT_RATE, COALESCE(bio.TOTAL_SUBMISSIONS, 0) AS
      TOTAL_REG_SUBMISSIONS, COALESCE(bio.APPROVED_SUBMISSIONS, 0) AS
      APPROVED_SUBMISSIONS, COALESCE(bio.TOTAL_SIGNALS, 0) AS
      TOTAL_SAFETY_SIGNALS, COALESCE(bio.HIGH_SEVERITY_SIGNALS, 0) AS
      HIGH_SEVERITY_SIGNALS, COALESCE(mfg.TOTAL_BATCHES, 0) AS TOTAL_BATCHES,
      mfg.AVG_YIELD, COALESCE(mfg.GMP_COMPLIANT_BATCHES, 0) AS
      GMP_COMPLIANT_BATCHES, COALESCE(mfg.TOTAL_DEVIATIONS, 0) AS
      TOTAL_DEVIATIONS, mfg.AVG_OEE, COALESCE(mfg.TOTAL_QUALITY_EVENTS, 0) AS
      TOTAL_QUALITY_EVENTS, COALESCE(mfg.MAJOR_QUALITY_EVENTS, 0) AS
      MAJOR_QUALITY_EVENTS, COALESCE(com.TOTAL_SALES_TRANSACTIONS, 0) AS
      TOTAL_SALES_TRANSACTIONS, COALESCE(com.TOTAL_REVENUE_USD, 0) AS
      TOTAL_REVENUE_USD, COALESCE(com.TOTAL_UNITS_SOLD, 0) AS TOTAL_UNITS_SOLD,
      com.AVG_NET_PRICE, COALESCE(com.MARKETS_ACTIVE, 0) AS MARKETS_ACTIVE,
      com.AVG_REIMBURSEMENT_RATE, com.AVG_DISCOUNT_PERCENT,
      COALESCE(com.TOTAL_NET_REVENUE, 0) AS TOTAL_NET_REVENUE,
      COALESCE(rnd.TOTAL_PROGRAMS, 0) AS TOTAL_RND_PROGRAMS, rnd.LATEST_PHASE AS
      RND_LATEST_PHASE, COALESCE(rnd.TOTAL_BUDGET, 0) AS RND_TOTAL_BUDGET,
      COALESCE(rnd.TOTAL_SPEND, 0) AS RND_TOTAL_SPEND,
      rnd.AVG_BUDGET_UTILIZATION AS RND_BUDGET_UTILIZATION_PCT,
      COALESCE(rnd.TOTAL_IND_FILINGS, 0) AS TOTAL_IND_FILINGS,
      COALESCE(rnd.CLINICAL_HOLDS, 0) AS CLINICAL_HOLDS,
      COALESCE(rnd.TOTAL_RESEARCH_EXPERIMENTS, 0) AS TOTAL_RESEARCH_EXPERIMENTS,
      COALESCE(pv.TOTAL_AE_CASES, 0) AS TOTAL_AE_CASES,
      COALESCE(pv.SERIOUS_CASES, 0) AS SERIOUS_AE_CASES,
      COALESCE(pv.FATAL_CASES, 0) AS FATAL_AE_CASES,
      COALESCE(pv.TOTAL_ICSR_SUBMITTED, 0) AS TOTAL_ICSR_SUBMITTED,
      pv.AVG_DAYS_TO_SUBMIT_ICSR, COALESCE(pv.EXPEDITED_REPORTS, 0) AS
      EXPEDITED_REPORTS, COALESCE(pv.E2B_COMPLIANT_REPORTS, 0) AS
      E2B_COMPLIANT_REPORTS FROM product_list pl LEFT JOIN bio_summary bio ON
      pl.PRODUCT_NAME = bio.PRODUCT_NAME LEFT JOIN mfg_summary mfg ON
      pl.PRODUCT_NAME = mfg.PRODUCT_NAME LEFT JOIN com_summary com ON
      pl.PRODUCT_NAME = com.PRODUCT_NAME LEFT JOIN rnd_summary rnd ON
      pl.PRODUCT_NAME = rnd.PRODUCT_NAME LEFT JOIN pv_summary pv ON
      pl.PRODUCT_NAME = pv.PRODUCT_NAME
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: TOTAL_AE_CASES
          - column: AVG_YIELD
          - column: PRODUCT_NAME
        referenceAlias: loading_Biosimilar_Switching_Adoption_Analytics_data_in_iceberg
    NullCombinationCheck:
      productState:
        checks:
          - columns:
              - AVG_DISCOUNT_PERCENT
            expression: ">"
            number: 5
        referenceAlias: loading_Biosimilar_Switching_Adoption_Analytics_data_in_iceberg
    UniquenessCheck:
      productState:
        checks:
          - column: Product_Name
        referenceAlias: loading_Biosimilar_Switching_Adoption_Analytics_data_in_iceberg
