productState:
  isDynamic: true
  alias: Load_Batch_Yield_Analytics_or_Optimization_data_in_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      PRODUCT_NAME:
        type: STRING
        description: Name of the manufactured product; primary aggregation dimension
        sourceColumn: PRODUCT_NAME
        sourceTable: STG_BATCH_RECORDS
      BRAND_NAME:
        type: STRING
        description: Commercial brand name of the biosimilar product
        sourceColumn: BRAND_NAME
        sourceTable: STG_REGULATORY_SUBMISSIONS
      THERAPEUTIC_AREA:
        type: STRING
        description: Therapeutic area of the product (e.g., Immunology, Oncology)
        sourceColumn: THERAPEUTIC_AREA
        sourceTable: STG_CLINICAL_TRIALS
      MANUFACTURING_SITE:
        type: STRING
        description: Facility location; secondary aggregation dimension for site-level
          benchmarking
        sourceColumn: MANUFACTURING_SITE
        sourceTable: STG_BATCH_RECORDS
      TOTAL_BATCHES:
        type: STRING
        description: "Total manufacturing batches: COUNT(DISTINCT BATCH_ID)"
        sourceColumn: BATCH_ID
        sourceTable: STG_BATCH_RECORDS
      RELEASED_BATCHES:
        type: STRING
        description: "Released batches: COUNT(DISTINCT BATCH_ID) WHERE STATUS = 'Released'"
        sourceColumn: STATUS
        sourceTable: STG_BATCH_RECORDS
      REJECTED_BATCHES:
        type: STRING
        description: "Rejected batches: COUNT(DISTINCT BATCH_ID) WHERE STATUS = 'Rejected'"
        sourceColumn: STATUS
        sourceTable: STG_BATCH_RECORDS
      IN_PRODUCTION_BATCHES:
        type: STRING
        description: "Batches currently in production: COUNT(DISTINCT BATCH_ID) WHERE
          STATUS = 'In Production'"
        sourceColumn: STATUS
        sourceTable: STG_BATCH_RECORDS
      AVG_YIELD_PCT:
        type: STRING
        description: "Average batch yield: AVG(YIELD_PERCENT)"
        sourceColumn: YIELD_PERCENT
        sourceTable: STG_BATCH_RECORDS
      MIN_YIELD_PCT:
        type: STRING
        description: "Minimum batch yield: MIN(YIELD_PERCENT)"
        sourceColumn: YIELD_PERCENT
        sourceTable: STG_BATCH_RECORDS
      MAX_YIELD_PCT:
        type: STRING
        description: "Maximum batch yield: MAX(YIELD_PERCENT)"
        sourceColumn: YIELD_PERCENT
        sourceTable: STG_BATCH_RECORDS
      TOTAL_OUTPUT_QUANTITY:
        type: STRING
        description: "Total production output: SUM(BATCH_SIZE)"
        sourceColumn: BATCH_SIZE
        sourceTable: STG_BATCH_RECORDS
      BATCH_SIZE_UOM:
        type: STRING
        description: Unit of measure for batch size (e.g., mg, L, IU)
        sourceColumn: BATCH_SIZE_UOM
        sourceTable: STG_BATCH_RECORDS
      TOTAL_DEVIATIONS:
        type: STRING
        description: "Total deviations across all batches: SUM(DEVIATION_COUNT)"
        sourceColumn: DEVIATION_COUNT
        sourceTable: STG_BATCH_RECORDS
      AVG_DEVIATIONS_PER_BATCH:
        type: STRING
        description: "Average deviations per batch: SUM(DEVIATION_COUNT) /
          COUNT(TOTAL_BATCHES)"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      GMP_COMPLIANT_BATCHES:
        type: STRING
        description: "GMP-compliant batches: SUM(GMP_COMPLIANT)"
        sourceColumn: GMP_COMPLIANT
        sourceTable: STG_BATCH_RECORDS
      AVG_CYCLE_TIME_DAYS:
        type: STRING
        description: "Average manufacturing cycle time: AVG(DATEDIFF('day', START_DATE,
          END_DATE))"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      RIGHT_FIRST_TIME_PCT:
        type: STRING
        description: "Right first time rate: COUNT(Released with 0 deviations) /
          COUNT(TOTAL_BATCHES) 100"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      BATCH_REJECTION_PCT:
        type: STRING
        description: "Batch rejection rate: COUNT(Rejected) / COUNT(TOTAL_BATCHES) 100"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      EFFECTIVE_OUTPUT_QUANTITY:
        type: STRING
        description: "Effective output after yield losses: SUM(BATCH_SIZE YIELD_PERCENT
          / 100)"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      AVG_OEE_PCT:
        type: STRING
        description: "Average OEE: AVG(OEE_PERCENT)"
        sourceColumn: OEE_PERCENT
        sourceTable: STG_EQUIPMENT_OEE
      AVG_AVAILABILITY_PCT:
        type: STRING
        description: "Average equipment availability: AVG(AVAILABILITY_PERCENT)"
        sourceColumn: AVAILABILITY_PERCENT
        sourceTable: STG_EQUIPMENT_OEE
      AVG_PERFORMANCE_PCT:
        type: STRING
        description: "Average equipment performance: AVG(PERFORMANCE_PERCENT)"
        sourceColumn: PERFORMANCE_PERCENT
        sourceTable: STG_EQUIPMENT_OEE
      AVG_EQUIPMENT_QUALITY_PCT:
        type: STRING
        description: "Average equipment quality rate: AVG(QUALITY_PERCENT)"
        sourceColumn: QUALITY_PERCENT
        sourceTable: STG_EQUIPMENT_OEE
      PRODUCTION_DOWNTIME_HOURS:
        type: STRING
        description: "Total production downtime: SUM(DOWNTIME_HOURS)"
        sourceColumn: DOWNTIME_HOURS
        sourceTable: STG_EQUIPMENT_OEE
      AVG_DOWNTIME_HOURS_PER_EQUIPMENT:
        type: STRING
        description: "Average downtime per equipment: SUM(DOWNTIME_HOURS) /
          COUNT(DISTINCT EQUIPMENT_ID)"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      TOTAL_EQUIPMENT_COUNT:
        type: STRING
        description: "Total equipment count: COUNT(DISTINCT EQUIPMENT_ID)"
        sourceColumn: EQUIPMENT_ID
        sourceTable: STG_EQUIPMENT_OEE
      CORRECTIVE_MAINTENANCE_COUNT:
        type: STRING
        description: "Corrective maintenance events: COUNT(*) WHERE MAINTENANCE_TYPE =
          'Corrective'"
        sourceColumn: MAINTENANCE_TYPE
        sourceTable: STG_EQUIPMENT_OEE
      PREVENTIVE_MAINTENANCE_COUNT:
        type: STRING
        description: "Preventive maintenance events: COUNT(*) WHERE MAINTENANCE_TYPE =
          'Preventive'"
        sourceColumn: MAINTENANCE_TYPE
        sourceTable: STG_EQUIPMENT_OEE
      PREDICTIVE_MAINTENANCE_COUNT:
        type: STRING
        description: "Predictive maintenance events: COUNT(*) WHERE MAINTENANCE_TYPE =
          'Predictive'"
        sourceColumn: MAINTENANCE_TYPE
        sourceTable: STG_EQUIPMENT_OEE
      CAPACITY_UTILIZATION_PCT:
        type: STRING
        description: "Capacity utilization: (EFFECTIVE_OUTPUT_QUANTITY /
          TOTAL_OUTPUT_QUANTITY) 100"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      TOTAL_QUALITY_EVENTS:
        type: STRING
        description: "Total quality events: COUNT(DISTINCT EVENT_ID)"
        sourceColumn: EVENT_ID
        sourceTable: STG_QUALITY_EVENTS
      MAJOR_EVENTS:
        type: STRING
        description: "Major quality events: COUNT(*) WHERE SEVERITY = 'Major'"
        sourceColumn: SEVERITY
        sourceTable: STG_QUALITY_EVENTS
      MINOR_EVENTS:
        type: STRING
        description: "Minor quality events: COUNT(*) WHERE SEVERITY = 'Minor'"
        sourceColumn: SEVERITY
        sourceTable: STG_QUALITY_EVENTS
      OOS_COUNT:
        type: STRING
        description: "Out-of-specification events: COUNT(*) WHERE EVENT_TYPE = 'OOS'"
        sourceColumn: EVENT_TYPE
        sourceTable: STG_QUALITY_EVENTS
      QUALITY_DEVIATION_COUNT:
        type: STRING
        description: "Quality deviation events: COUNT(*) WHERE EVENT_TYPE = 'Deviation'"
        sourceColumn: EVENT_TYPE
        sourceTable: STG_QUALITY_EVENTS
      OPEN_EVENTS:
        type: STRING
        description: "Open quality events: COUNT(*) WHERE STATUS = 'Open'"
        sourceColumn: STATUS
        sourceTable: STG_QUALITY_EVENTS
      CLOSED_EVENTS:
        type: STRING
        description: "Closed quality events: COUNT(*) WHERE STATUS = 'Closed'"
        sourceColumn: STATUS
        sourceTable: STG_QUALITY_EVENTS
      TOTAL_CAPAS:
        type: STRING
        description: "Total CAPAs: COUNT(DISTINCT CAPA_ID)"
        sourceColumn: CAPA_ID
        sourceTable: STG_QUALITY_EVENTS
      QUALITY_EVENT_CLOSURE_RATE_PCT:
        type: STRING
        description: "Quality event closure rate: COUNT(CLOSED_EVENTS) /
          COUNT(TOTAL_QUALITY_EVENTS) 100"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      LATEST_TRIAL_PHASE:
        type: STRING
        description: "Most advanced clinical trial phase for the product: MAX(PHASE)"
        sourceColumn: PHASE
        sourceTable: STG_CLINICAL_TRIALS
      BIO_TRIAL_STATUS:
        type: STRING
