transformation:
  - isDynamic: true
    alias: Transform
    description: Transforming Batch Yield Analytics Or Optimization
    sequence: 5
    inputDataFrameList:
      - inputDataFrame: Quality_Events_1
        tempViewName: QUALITY_EVENTS
      - inputDataFrame: Batch_Records_1
        tempViewName: BATCH_RECORDS
      - inputDataFrame: Equipment_Oee_1
        tempViewName: EQUIPMENT_OEE
      - inputDataFrame: Biosimilar_Clinical_And_Regulatory_Intelligence_Product_1
        tempViewName: BIOSIMILAR_REGULATORY_INTEL
    query: WITH batch_metrics AS ( SELECT br.PRODUCT_NAME, br.MANUFACTURING_SITE,
      COUNT(DISTINCT br.BATCH_ID) AS TOTAL_BATCHES, SUM(CASE WHEN br.STATUS =
      'Released' THEN 1 ELSE 0 END) AS RELEASED_BATCHES, SUM(CASE WHEN br.STATUS
      = 'Rejected' THEN 1 ELSE 0 END) AS REJECTED_BATCHES, SUM(CASE WHEN
      br.STATUS = 'In Production' THEN 1 ELSE 0 END) AS IN_PRODUCTION_BATCHES,
      AVG(br.YIELD_PERCENT) AS AVG_YIELD_PCT, MIN(br.YIELD_PERCENT) AS
      MIN_YIELD_PCT, MAX(br.YIELD_PERCENT) AS MAX_YIELD_PCT, SUM(br.BATCH_SIZE)
      AS TOTAL_OUTPUT_QUANTITY, MAX(br.BATCH_SIZE_UOM) AS BATCH_SIZE_UOM,
      SUM(br.DEVIATION_COUNT) AS TOTAL_DEVIATIONS, AVG(br.DEVIATION_COUNT) AS
      AVG_DEVIATIONS_PER_BATCH, SUM(CASE WHEN br.GMP_COMPLIANT = 1 THEN 1 ELSE 0
      END) AS GMP_COMPLIANT_BATCHES, AVG(datediff(br.END_DATE, br.START_DATE))
      AS AVG_CYCLE_TIME_DAYS, ROUND( SUM(CASE WHEN br.STATUS = 'Released' THEN 1
      ELSE 0 END) * 100.0 / CASE WHEN COUNT(DISTINCT br.BATCH_ID) = 0 THEN NULL
      ELSE COUNT(DISTINCT br.BATCH_ID) END , 2) AS RIGHT_FIRST_TIME_PCT, ROUND(
      SUM(CASE WHEN br.STATUS = 'Rejected' THEN 1 ELSE 0 END) * 100.0 / CASE
      WHEN COUNT(DISTINCT br.BATCH_ID) = 0 THEN NULL ELSE COUNT(DISTINCT
      br.BATCH_ID) END , 2) AS BATCH_REJECTION_PCT FROM BATCH_RECORDS br GROUP
      BY br.PRODUCT_NAME, br.MANUFACTURING_SITE ), equipment_performance AS (
      SELECT eo.MANUFACTURING_SITE, AVG(eo.OEE_PERCENT) AS AVG_OEE_PCT,
      AVG(eo.AVAILABILITY_PERCENT) AS AVG_AVAILABILITY_PCT,
      AVG(eo.PERFORMANCE_PERCENT) AS AVG_PERFORMANCE_PCT,
      AVG(eo.QUALITY_PERCENT) AS AVG_EQUIPMENT_QUALITY_PCT,
      SUM(eo.DOWNTIME_HOURS) AS TOTAL_DOWNTIME_HOURS, AVG(eo.DOWNTIME_HOURS) AS
      AVG_DOWNTIME_HOURS_PER_EQUIPMENT, COUNT(DISTINCT eo.EQUIPMENT_ID) AS
      TOTAL_EQUIPMENT_COUNT, SUM(CASE WHEN eo.MAINTENANCE_TYPE = 'Corrective'
      THEN 1 ELSE 0 END) AS CORRECTIVE_MAINTENANCE_COUNT, SUM(CASE WHEN
      eo.MAINTENANCE_TYPE = 'Preventive' THEN 1 ELSE 0 END) AS
      PREVENTIVE_MAINTENANCE_COUNT, SUM(CASE WHEN eo.MAINTENANCE_TYPE =
      'Predictive' THEN 1 ELSE 0 END) AS PREDICTIVE_MAINTENANCE_COUNT,
      ROUND(AVG(eo.AVAILABILITY_PERCENT) * AVG(eo.PERFORMANCE_PERCENT) / 100, 2)
      AS CAPACITY_UTILIZATION_PCT FROM EQUIPMENT_OEE eo GROUP BY
      eo.MANUFACTURING_SITE ), quality_summary AS ( SELECT qe.PRODUCT_NAME,
      qe.MANUFACTURING_SITE, COUNT(DISTINCT qe.EVENT_ID) AS
      TOTAL_QUALITY_EVENTS, SUM(CASE WHEN qe.SEVERITY = 'Major' THEN 1 ELSE 0
      END) AS MAJOR_EVENTS, SUM(CASE WHEN qe.SEVERITY = 'Minor' THEN 1 ELSE 0
      END) AS MINOR_EVENTS, SUM(CASE WHEN qe.EVENT_TYPE = 'OOS' THEN 1 ELSE 0
      END) AS OOS_COUNT, SUM(CASE WHEN qe.EVENT_TYPE = 'Deviation' THEN 1 ELSE 0
      END) AS DEVIATION_COUNT, SUM(CASE WHEN qe.STATUS = 'Open' THEN 1 ELSE 0
      END) AS OPEN_EVENTS, SUM(CASE WHEN qe.STATUS = 'Closed' THEN 1 ELSE 0 END)
      AS CLOSED_EVENTS, COUNT(DISTINCT qe.CAPA_ID) AS TOTAL_CAPAS FROM
      QUALITY_EVENTS qe GROUP BY qe.PRODUCT_NAME, qe.MANUFACTURING_SITE ),
      bio_regulatory_cross AS ( SELECT * FROM ( SELECT bio.PRODUCT_NAME,
      bio.BRAND_NAME, bio.THERAPEUTIC_AREA, bio.PHASE AS LATEST_TRIAL_PHASE,
      bio.TRIAL_STATUS, bio.REGULATORY_AUTHORITY, bio.APPROVAL_STATUS,
      bio.APPROVAL_DATE, bio.REFERENCE_BIOLOGIC, bio.PATENT_EXPIRY_DATE,
      bio.ENROLLMENT_RATE_PCT, bio.SIGNAL_SEVERITY AS LATEST_SIGNAL_SEVERITY,
      bio.SIGNAL_STATUS AS LATEST_SIGNAL_STATUS, ROW_NUMBER() OVER (PARTITION BY
      bio.PRODUCT_NAME ORDER BY bio.APPROVAL_DATE DESC) AS RN FROM
      BIOSIMILAR_REGULATORY_INTEL bio ) t WHERE RN = 1 ) SELECT bm.PRODUCT_NAME,
      brc.BRAND_NAME, brc.THERAPEUTIC_AREA, bm.MANUFACTURING_SITE,
      bm.TOTAL_BATCHES, bm.RELEASED_BATCHES, bm.REJECTED_BATCHES,
      bm.IN_PRODUCTION_BATCHES, bm.AVG_YIELD_PCT, bm.MIN_YIELD_PCT,
      bm.MAX_YIELD_PCT, bm.TOTAL_OUTPUT_QUANTITY, bm.BATCH_SIZE_UOM,
      bm.TOTAL_DEVIATIONS, bm.AVG_DEVIATIONS_PER_BATCH,
      bm.GMP_COMPLIANT_BATCHES, bm.AVG_CYCLE_TIME_DAYS, bm.RIGHT_FIRST_TIME_PCT,
      bm.BATCH_REJECTION_PCT, ROUND(bm.TOTAL_OUTPUT_QUANTITY * bm.AVG_YIELD_PCT
      / 100, 2) AS EFFECTIVE_OUTPUT_QUANTITY, ep.AVG_OEE_PCT,
      ep.AVG_AVAILABILITY_PCT, ep.AVG_PERFORMANCE_PCT,
      ep.AVG_EQUIPMENT_QUALITY_PCT, ep.TOTAL_DOWNTIME_HOURS AS
      PRODUCTION_DOWNTIME_HOURS, ep.AVG_DOWNTIME_HOURS_PER_EQUIPMENT,
      ep.TOTAL_EQUIPMENT_COUNT, ep.CORRECTIVE_MAINTENANCE_COUNT,
      ep.PREVENTIVE_MAINTENANCE_COUNT, ep.PREDICTIVE_MAINTENANCE_COUNT,
      ep.CAPACITY_UTILIZATION_PCT, qs.TOTAL_QUALITY_EVENTS, qs.MAJOR_EVENTS,
      qs.MINOR_EVENTS, qs.OOS_COUNT, qs.DEVIATION_COUNT AS
      QUALITY_DEVIATION_COUNT, qs.OPEN_EVENTS, qs.CLOSED_EVENTS, qs.TOTAL_CAPAS,
      ROUND( qs.CLOSED_EVENTS * 100.0 / CASE WHEN qs.TOTAL_QUALITY_EVENTS = 0
      THEN NULL ELSE qs.TOTAL_QUALITY_EVENTS END , 2) AS
      QUALITY_EVENT_CLOSURE_RATE_PCT, brc.LATEST_TRIAL_PHASE, brc.TRIAL_STATUS
      AS BIO_TRIAL_STATUS, brc.REGULATORY_AUTHORITY, brc.APPROVAL_STATUS AS
      BIO_APPROVAL_STATUS, brc.APPROVAL_DATE AS BIO_APPROVAL_DATE,
      brc.REFERENCE_BIOLOGIC, brc.PATENT_EXPIRY_DATE, brc.ENROLLMENT_RATE_PCT AS
      BIO_ENROLLMENT_RATE_PCT, brc.LATEST_SIGNAL_SEVERITY,
      brc.LATEST_SIGNAL_STATUS FROM batch_metrics bm LEFT JOIN
      equipment_performance ep ON bm.MANUFACTURING_SITE = ep.MANUFACTURING_SITE
      LEFT JOIN quality_summary qs ON bm.PRODUCT_NAME = qs.PRODUCT_NAME AND
      bm.MANUFACTURING_SITE = qs.MANUFACTURING_SITE LEFT JOIN
      bio_regulatory_cross brc ON bm.PRODUCT_NAME = brc.PRODUCT_NAME
    optional:
      persistDataFrame: false
      loggingOptions:
        printSchema: true
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules: {}
