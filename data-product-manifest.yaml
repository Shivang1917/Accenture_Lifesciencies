productState:
  isDynamic: true
  alias: loading_Pharma_Covigilance_and_Patient_Safety_Product_data_in_iceberg
  retentionVersions: ""
  logicalSchema:
    properties:
      CASE_ID:
        type: STRING
        description: Unique identifier for the adverse event safety case
        sourceColumn: CASE_ID
        sourceTable: STG_SAFETY_CASES
      CASE_NUMBER:
        type: STRING
        description: Business reference number for the safety case (e.g., BIO-2025-00001)
        sourceColumn: CASE_NUMBER
        sourceTable: STG_SAFETY_CASES
      PRODUCT_NAME:
        type: STRING
        description: Name of the product associated with the adverse event
        sourceColumn: PRODUCT_NAME
        sourceTable: STG_SAFETY_CASES
      EVENT_TYPE:
        type: STRING
        description: Type of safety event (e.g., Adverse Event, Medication Error)
        sourceColumn: EVENT_TYPE
        sourceTable: STG_SAFETY_CASES
      SERIOUSNESS:
        type: STRING
        description: Seriousness classification (Serious, Non-Serious)
        sourceColumn: SERIOUSNESS
        sourceTable: STG_SAFETY_CASES
      SERIOUSNESS_CRITERIA:
        type: STRING
        description: Specific seriousness criteria (e.g., Hospitalization, Life Threatening)
        sourceColumn: SERIOUSNESS_CRITERIA
        sourceTable: STG_SAFETY_CASES
      OUTCOME:
        type: STRING
        description: Patient outcome (e.g., Recovered, Recovering, Fatal)
        sourceColumn: OUTCOME
        sourceTable: STG_SAFETY_CASES
      REPORTER_TYPE:
        type: STRING
        description: Type of reporter (e.g., HCP, Consumer, Regulatory Authority)
        sourceColumn: REPORTER_TYPE
        sourceTable: STG_SAFETY_CASES
      COUNTRY_OF_OCCURRENCE:
        type: STRING
        description: Country where the adverse event occurred
        sourceColumn: COUNTRY_OF_OCCURRENCE
        sourceTable: STG_SAFETY_CASES
      RECEIPT_DATE:
        type: STRING
        description: Date the safety case was received
        sourceColumn: RECEIPT_DATE
        sourceTable: STG_SAFETY_CASES
      ONSET_DATE:
        type: STRING
        description: Date of adverse event onset
        sourceColumn: ONSET_DATE
        sourceTable: STG_SAFETY_CASES
      REPORT_TYPE:
        type: STRING
        description: Type of report (e.g., Spontaneous, Clinical Trial, Literature)
        sourceColumn: REPORT_TYPE
        sourceTable: STG_SAFETY_CASES
      CAUSALITY_ASSESSMENT:
        type: STRING
        description: Causality determination (e.g., Possible, Probable, Unlikely)
        sourceColumn: CAUSALITY_ASSESSMENT
        sourceTable: STG_SAFETY_CASES
      MED_DRA_PT:
        type: STRING
        description: MedDRA Preferred Term for the adverse event (e.g., Cardiotoxicity)
        sourceColumn: MED_DRA_PT
        sourceTable: STG_SAFETY_CASES
      MED_DRA_SOC:
        type: STRING
        description: MedDRA System Organ Class (e.g., Cardiac disorders, Nervous system
          disorders)
        sourceColumn: MED_DRA_SOC
        sourceTable: STG_SAFETY_CASES
      PATIENT_AGE:
        type: STRING
        description: Age of the patient at time of adverse event
        sourceColumn: PATIENT_AGE
        sourceTable: STG_SAFETY_CASES
      PATIENT_GENDER:
        type: STRING
        description: Gender of the patient (Male, Female)
        sourceColumn: PATIENT_GENDER
        sourceTable: STG_SAFETY_CASES
      E2B_VERSION:
        type: STRING
        description: E2B electronic transmission format version (e.g., R3)
        sourceColumn: E2B_VERSION
        sourceTable: STG_SAFETY_CASES
      ICSR_ID:
        type: STRING
        description: Unique identifier for the Individual Case Safety Report
        sourceColumn: ICSR_ID
        sourceTable: STG_ICSR_REPORTS
      ICSR_DESTINATION:
        type: STRING
        description: Regulatory destination for ICSR submission (e.g., FAERS,
          EudraVigilance)
        sourceColumn: DESTINATION
        sourceTable: STG_ICSR_REPORTS
      ICSR_SUBMISSION_DATE:
        type: STRING
        description: Date the ICSR was submitted to the regulatory authority
        sourceColumn: SUBMISSION_DATE
        sourceTable: STG_ICSR_REPORTS
      ICSR_DUE_DATE:
        type: STRING
        description: Regulatory deadline for ICSR submission
        sourceColumn: DUE_DATE
        sourceTable: STG_ICSR_REPORTS
      ICSR_STATUS:
        type: STRING
        description: Current status of ICSR submission (Submitted, Pending, Overdue)
        sourceColumn: STATUS
        sourceTable: STG_ICSR_REPORTS
      E2B_COMPLIANT:
        type: STRING
        description: Whether the ICSR meets E2B compliance standards (true/false)
        sourceColumn: E2B_COMPLIANT
        sourceTable: STG_ICSR_REPORTS
      EXPEDITED:
        type: STRING
        description: Whether the report was submitted as an expedited report (true/false)
        sourceColumn: EXPEDITED
        sourceTable: STG_ICSR_REPORTS
      DAYS_TO_SUBMIT:
        type: STRING
        description: "Derived days to submit: DATEDIFF('day', RECEIPT_DATE,
          ICSR_SUBMISSION_DATE)"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      PSUR_ID:
        type: STRING
        description: Unique identifier for the Periodic Safety Update Report
        sourceColumn: PSUR_ID
        sourceTable: STG_PSUR_REPORTS
      PSUR_TYPE:
        type: STRING
        description: Type of periodic report (e.g., PSUR/PBRER, DSUR)
        sourceColumn: REPORT_TYPE
        sourceTable: STG_PSUR_REPORTS
      PSUR_STATUS:
        type: STRING
        description: Current status of the PSUR (Submitted, In Preparation, Planned)
        sourceColumn: STATUS
        sourceTable: STG_PSUR_REPORTS
      PSUR_TOTAL_CASES:
        type: STRING
        description: Total number of safety cases included in the PSUR
        sourceColumn: TOTAL_CASES
        sourceTable: STG_PSUR_REPORTS
      PSUR_SERIOUS_CASES:
        type: STRING
        description: Number of serious cases included in the PSUR
        sourceColumn: SERIOUS_CASES
        sourceTable: STG_PSUR_REPORTS
      BENEFIT_RISK_CONCLUSION:
        type: STRING
        description: Overall benefit-risk assessment conclusion from the PSUR
        sourceColumn: BENEFIT_RISK_CONCLUSION
        sourceTable: STG_PSUR_REPORTS
