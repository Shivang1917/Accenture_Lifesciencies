        sourceColumn: Calculated Column
        sourceTable: Calculated Column
      COMPLETENESS_SLA:
        type: STRING
        description: "Data quality SLA: COUNT(APPROVAL_STATUS IS NOT NULL) / COUNT(*) 99%"
        sourceColumn: Calculated Column
        sourceTable: Calculated Column
