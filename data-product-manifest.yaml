transformation:
  - isDynamic: true
    alias: Transformation
    description: Transform Data Biosimilar Clinical And Regulatory Intelligence Product
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Safety_Signals_1
        tempViewName: SAFETY_SIGNALS
      - inputDataFrame: Regulatory_Submissions_1
        tempViewName: REGULATORY_SUBMISSIONS
      - inputDataFrame: Clinical_Trials_1
        tempViewName: CLINICAL_TRIALS
    query: SELECT ct.PRODUCT_NAME, rs.BRAND_NAME, rs.REFERENCE_BIOLOGIC,
      ct.THERAPEUTIC_AREA, ct.TRIAL_ID, ct.TRIAL_NAME, ct.PHASE, ct.STATUS AS
      TRIAL_STATUS, ct.ENROLLMENT_TARGET, ct.ENROLLMENT_ACTUAL, ROUND( CASE WHEN
      ct.ENROLLMENT_TARGET = 0 THEN NULL ELSE (ct.ENROLLMENT_ACTUAL * 100.0) /
      ct.ENROLLMENT_TARGET END, 2 ) AS ENROLLMENT_RATE_PCT, ct.COUNTRY,
      ct.REGULATORY_BODY AS REGULATORY_AUTHORITY, rs.SUBMISSION_ID,
      rs.SUBMISSION_TYPE, rs.SUBMISSION_DATE, rs.TARGET_APPROVAL_DATE,
      rs.ACTUAL_APPROVAL_DATE, rs.STATUS AS APPROVAL_STATUS,
      COALESCE(rs.ACTUAL_APPROVAL_DATE, rs.TARGET_APPROVAL_DATE) AS
      APPROVAL_DATE, datediff( COALESCE(rs.ACTUAL_APPROVAL_DATE,
      current_date()), rs.SUBMISSION_DATE ) AS DAYS_SINCE_SUBMISSION,
      rs.POST_APPROVAL_COMMITMENTS, rs.PATENT_EXPIRY_DATE, ss.SIGNAL_ID,
      ss.SIGNAL_TYPE, ss.SEVERITY AS SIGNAL_SEVERITY, ss.STATUS AS
      SIGNAL_STATUS, ss.DETECTION_DATE AS SIGNAL_DETECTION_DATE FROM
      CLINICAL_TRIALS ct LEFT JOIN REGULATORY_SUBMISSIONS rs ON ct.PRODUCT_NAME
      = rs.PRODUCT_NAME LEFT JOIN SAFETY_SIGNALS ss ON ct.PRODUCT_NAME =
      ss.PRODUCT_NAME
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: APPROVAL_STATUS
          - column: Trial_Id
        referenceAlias: loading_Biosimilar_Clinical_And_Regulatory_Intelligence_Product_data_in_iceberg
    NullCombinationCheck:
      productState:
        checks:
          - columns:
              - ENROLLMENT_RATE_PCT
            expression: <
            number: 25
        referenceAlias: loading_Biosimilar_Clinical_And_Regulatory_Intelligence_Product_data_in_iceberg
