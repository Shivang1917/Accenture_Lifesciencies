        description: Country where the sale occurred
        sourceColumn: COUNTRY
        sourceTable: SALES_DATA
      CHANNEL:
        type: STRING
        description: Sales channel (e.g., Hospital, Retail, Specialty)
        sourceColumn: CHANNEL
        sourceTable: SALES_DATA
