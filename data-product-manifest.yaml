transformation:
  - isDynamic: true
    alias: Transform
    description: Transforming Global Commercial Market Access data
    sequence: 4
    inputDataFrameList:
      - inputDataFrame: Payer_Contracts_1
        tempViewName: PAYER_CONTRACTS
      - inputDataFrame: Sales_Data_1
        tempViewName: SALES_DATA
      - inputDataFrame: Market_Access_1
        tempViewName: MARKET_ACCESS
    query: SELECT sd.SALE_ID, sd.PRODUCT_NAME, sd.THERAPEUTIC_AREA, sd.MARKET,
      sd.COUNTRY, sd.CHANNEL, sd.SALE_DATE, sd.QUANTITY, sd.REVENUE_USD,
      sd.NET_PRICE_USD, sd.PAYER_TYPE, sd.FORMULARY_STATUS, ma.COVERAGE_STATUS,
      ma.FORMULARY_TIER, ma.REIMBURSEMENT_RATE, ma.HTA_OUTCOME,
      ma.PRICE_PER_UNIT_USD AS LIST_PRICE_USD, pc.CONTRACT_ID, pc.CONTRACT_TYPE,
      pc.DISCOUNT_PERCENT, pc.REBATE_PERCENT, pc.STATUS AS CONTRACT_STATUS,
      pc.ANNUAL_VOLUME_COMMITMENT, sd.REVENUE_USD * (1 -
      COALESCE(pc.DISCOUNT_PERCENT, 0) / 100.0) AS NET_REVENUE_AFTER_DISCOUNT
      FROM SALES_DATA sd LEFT JOIN MARKET_ACCESS ma ON sd.PRODUCT_NAME =
      ma.PRODUCT_NAME AND sd.COUNTRY = ma.COUNTRY LEFT JOIN PAYER_CONTRACTS pc
      ON sd.PRODUCT_NAME = pc.PRODUCT_NAME AND sd.COUNTRY = pc.COUNTRY
    optional:
      persistDataFrame: false
    type: operationThroughSqlQuery
controlPort:
  dataQualityRules:
    NullValueCheck:
      productState:
        checks:
          - column: REVENUE_USD
          - column: MARKET
          - column: SALE_DATE
        referenceAlias: Load_Global_Commercial_Market_Access_data_in_iceberg
    NullCombinationCheck:
      productState:
        checks:
          - columns:
              - DISCOUNT_PERCENT
            expression: ">"
            number: 10
          - columns:
              - REBATE_PERCENT
            expression: <
            number: 0
        referenceAlias: Load_Global_Commercial_Market_Access_data_in_iceberg
    UniquenessCheck:
      productState:
        checks:
          - column: SALE_ID
        referenceAlias: Load_Global_Commercial_Market_Access_data_in_iceberg
